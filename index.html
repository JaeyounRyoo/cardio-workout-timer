<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>맞춤 유산소 운동 타이머</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800;900&display=swap');
    
    * {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    /* 원형 프로그레스 바 애니메이션 */
    .progress-ring__circle {
      transition: stroke-dashoffset 0.35s ease, stroke 0.3s ease;
      transform: rotate(-90deg);
      transform-origin: 50% 50%;
    }

    /* 숫자 입력 스핀 버튼 제거 */
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { 
      -webkit-appearance: none; 
      margin: 0; 
    }
    input[type=number] {
      -moz-appearance: textfield;
    }

    /* 토스트 팝업 애니메이션 */
    .toast-animate {
      animation: fadeInOut 2.5s forwards cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes fadeInOut {
      0% { opacity: 0; transform: translate(-50%, 20px) scale(0.95); }
      15% { opacity: 1; transform: translate(-50%, 0) scale(1); }
      80% { opacity: 1; transform: translate(-50%, 0) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -10px) scale(0.95); }
    }

    /* 운동 중 펄스 및 박진감 애니메이션 */
    @keyframes beatPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }
    .pulse-rhythm {
      animation: beatPulse 1s ease-in-out infinite;
    }
    @keyframes urgentPulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 12px rgba(239, 68, 68, 0.6)); }
      50% { transform: scale(1.08); filter: drop-shadow(0 0 20px rgba(239, 68, 68, 0.9)); }
    }
    .pulse-urgent {
      animation: urgentPulse 0.25s ease-in-out infinite;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col items-center justify-center p-3 sm:p-5 selection:bg-emerald-500 selection:text-white">

  <!-- 메인 컨테이너 -->
  <div class="w-full max-w-md bg-white rounded-3xl shadow-xl shadow-slate-200/80 border border-slate-100 overflow-hidden relative">

    <!-- ==================== 1. 설정 화면 (SETUP VIEW) ==================== -->
    <div id="setupView" class="p-4 sm:p-6 space-y-4">
      
      <!-- 헤더 -->
      <div class="flex items-center justify-between pb-3 border-b border-slate-100">
        <div class="flex items-center gap-2.5">
          <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center text-white shadow-md shadow-emerald-500/20">
            <i data-lucide="timer" class="w-5 h-5"></i>
          </div>
          <div>
            <h1 class="text-xl font-black text-slate-800 tracking-tight">유산소 루틴 타이머</h1>
            <p class="text-xs text-slate-400 font-medium">나만의 맞춤 운동 인터벌</p>
          </div>
        </div>
      </div>

      <!-- 추천 프리셋 버튼 -->
      <div class="grid grid-cols-3 gap-2">
        <button onclick="applyPreset('tabata')" class="py-2 px-2.5 rounded-xl text-xs font-bold bg-slate-50 text-slate-600 hover:bg-emerald-50 hover:text-emerald-700 border border-slate-200 transition active:scale-95 text-center">
          🔥 타바타 (20/10)
        </button>
        <button onclick="applyPreset('hiit')" class="py-2 px-2.5 rounded-xl text-xs font-bold bg-slate-50 text-slate-600 hover:bg-emerald-50 hover:text-emerald-700 border border-slate-200 transition active:scale-95 text-center">
          ⚡ HIIT (40/20)
        </button>
        <button onclick="applyPreset('cardio')" class="py-2 px-2.5 rounded-xl text-xs font-bold bg-slate-50 text-slate-600 hover:bg-emerald-50 hover:text-emerald-700 border border-slate-200 transition active:scale-95 text-center">
          🏃 스트레칭 (30/10)
        </button>
      </div>

      <!-- 루틴 관리 섹션 -->
      <div class="bg-slate-50/80 p-3.5 rounded-2xl border border-slate-200/80 space-y-3">
        <div class="flex items-center justify-between">
          <span class="text-xs font-bold text-slate-500 flex items-center gap-1.5">
            <i data-lucide="folder-heart" class="w-4 h-4 text-emerald-600"></i> 맞춤 루틴 선택
          </span>
          <!-- 추천 프리셋 뱃지 -->
          <div class="flex flex-wrap items-center gap-1">
            <button onclick="applyWorkoutPreset('기상전 누워서 스트레칭')" class="text-[11px] font-bold px-2 py-0.5 rounded-lg bg-emerald-100 text-emerald-800 hover:bg-emerald-200 transition">기상전</button>
            <button onclick="applyWorkoutPreset('점심 후 의자에서 허리 운동')" class="text-[11px] font-bold px-2 py-0.5 rounded-lg bg-blue-100 text-blue-800 hover:bg-blue-200 transition">점심의자</button>
            <button onclick="applyWorkoutPreset('자기 전 바닥에서 앉아서 고관절 운동')" class="text-[11px] font-bold px-2 py-0.5 rounded-lg bg-purple-100 text-purple-800 hover:bg-purple-200 transition">취침전</button>
            <button onclick="applyWorkoutPreset('전신 운동')" class="text-[11px] font-bold px-2 py-0.5 rounded-lg bg-amber-100 text-amber-800 hover:bg-amber-200 transition">전신</button>
          </div>
        </div>

        <!-- 루틴 불러오기 / 삭제 -->
        <div class="flex gap-1.5 items-center w-full">
          <div class="relative flex-1 min-w-0">
            <select id="routineSelect" onchange="loadSelectedRoutine()" class="w-full bg-white border border-slate-200 text-slate-700 text-xs sm:text-sm font-semibold rounded-xl px-3 py-2 pr-8 appearance-none focus:outline-none focus:ring-2 focus:ring-emerald-400 truncate">
              <option value="">-- 루틴 선택 --</option>
            </select>
            <i data-lucide="chevron-down" class="w-4 h-4 text-slate-400 absolute right-2.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
          </div>
          <button onclick="deleteSelectedRoutine()" title="선택 루틴 삭제" class="shrink-0 p-2 text-rose-500 hover:text-rose-700 hover:bg-rose-50 rounded-xl transition border border-slate-200/60 flex items-center justify-center">
            <i data-lucide="trash-2" class="w-4 h-4"></i>
          </button>
        </div>

        <!-- 현재 루틴 새로 저장 -->
        <div class="flex gap-1.5 items-center w-full">
          <input type="text" id="routineName" oninput="handleRoutineNameInput()" placeholder="새 루틴 이름 입력..." class="flex-1 min-w-0 bg-white border border-slate-200 text-slate-700 text-xs sm:text-sm font-medium rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-400">
          <button onclick="saveRoutine()" class="shrink-0 px-3 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-xs sm:text-sm font-bold rounded-xl shadow-sm transition active:scale-95 flex items-center gap-1">
            <i data-lucide="save" class="w-3.5 h-3.5"></i> 저장
          </button>
        </div>
      </div>

      <!-- 타이머 기본 설정 그리드 -->
      <div class="grid grid-cols-2 gap-2.5">
        
        <!-- 기본 운동 시간 -->
        <div class="bg-rose-50/60 p-3 rounded-2xl border border-rose-100 flex flex-col justify-between">
          <div class="flex items-center gap-1.5 text-xs font-bold text-rose-600 mb-1">
            <i data-lucide="flame" class="w-3.5 h-3.5"></i> 기본 운동 (초)
          </div>
          <div class="flex items-center justify-between mt-1">
            <button onclick="adjustVal('workTime', -5, 5); applyWorkTimeToAllExercises();" class="w-7 h-7 rounded-lg bg-white border border-rose-200 text-rose-600 flex items-center justify-center font-bold text-base active:scale-90 shadow-sm">−</button>
            <input type="number" id="workTime" value="30" min="5" max="300" onchange="applyWorkTimeToAllExercises(); saveSettings();" class="w-12 bg-transparent text-center font-black text-rose-600 text-lg focus:outline-none">
            <button onclick="adjustVal('workTime', 5, 300); applyWorkTimeToAllExercises();" class="w-7 h-7 rounded-lg bg-white border border-rose-200 text-rose-600 flex items-center justify-center font-bold text-base active:scale-90 shadow-sm">+</button>
          </div>
        </div>

        <!-- 동작 간 휴식 시간 -->
        <div class="bg-blue-50/60 p-3 rounded-2xl border border-blue-100 flex flex-col justify-between">
          <div class="flex items-center gap-1.5 text-xs font-bold text-blue-600 mb-1">
            <i data-lucide="coffee" class="w-3.5 h-3.5"></i> 동작 휴식 (초)
          </div>
          <div class="flex items-center justify-between mt-1">
            <button onclick="adjustVal('restTime', -5, 0)" class="w-7 h-7 rounded-lg bg-white border border-blue-200 text-blue-600 flex items-center justify-center font-bold text-base active:scale-90 shadow-sm">−</button>
            <input type="number" id="restTime" value="10" min="0" max="180" onchange="saveSettings()" class="w-12 bg-transparent text-center font-black text-blue-600 text-lg focus:outline-none">
            <button onclick="adjustVal('restTime', 5, 180)" class="w-7 h-7 rounded-lg bg-white border border-blue-200 text-blue-600 flex items-center justify-center font-bold text-base active:scale-90 shadow-sm">+</button>
          </div>
        </div>

        <!-- 세트 간 휴식 시간 -->
        <div class="bg-indigo-50/60 p-3 rounded-2xl border border-indigo-100 flex flex-col justify-between">
          <div class="flex items-center gap-1.5 text-xs font-bold text-indigo-700 mb-1">
            <i data-lucide="hourglass" class="w-3.5 h-3.5"></i> 세트 간 휴식 (초)
          </div>
          <div class="flex items-center justify-between mt-1">
            <button onclick="adjustVal('setRestTime', -5, 0)" class="w-7 h-7 rounded-lg bg-white border border-indigo-200 text-indigo-700 flex items-center justify-center font-bold text-base active:scale-90 shadow-sm">−</button>
            <input type="number" id="setRestTime" value="30" min="0" max="300" onchange="saveSettings()" class="w-12 bg-transparent text-center font-black text-indigo-700 text-lg focus:outline-none">
            <button onclick="adjustVal('setRestTime', 5, 300)" class="w-7 h-7 rounded-lg bg-white border border-indigo-200 text-indigo-700 flex items-center justify-center font-bold text-base active:scale-90 shadow-sm">+</button>
          </div>
        </div>

        <!-- 세트 수 -->
        <div class="bg-amber-50/60 p-3 rounded-2xl border border-amber-100 flex flex-col justify-between">
          <div class="flex items-center gap-1.5 text-xs font-bold text-amber-700 mb-1">
            <i data-lucide="repeat" class="w-3.5 h-3.5"></i> 세트 수
          </div>
          <div class="flex items-center justify-between mt-1">
            <button onclick="adjustVal('sets', -1, 1)" class="w-7 h-7 rounded-lg bg-white border border-amber-200 text-amber-700 flex items-center justify-center font-bold text-base active:scale-90 shadow-sm">−</button>
            <input type="number" id="sets" value="1" min="1" max="20" onchange="saveSettings()" class="w-12 bg-transparent text-center font-black text-amber-700 text-lg focus:outline-none">
            <button onclick="adjustVal('sets', 1, 20)" class="w-7 h-7 rounded-lg bg-white border border-amber-200 text-amber-700 flex items-center justify-center font-bold text-base active:scale-90 shadow-sm">+</button>
          </div>
        </div>

      </div>

      <!-- 세부 동작 리스트 -->
      <div class="space-y-2">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-1.5">
            <label class="text-xs font-bold text-slate-500 flex items-center gap-1">
              <i data-lucide="dumbbell" class="w-3.5 h-3.5 text-emerald-600"></i> 동작별 이름 및 개별 시간
            </label>
            <span id="exerciseCountBadge" class="text-[11px] font-extrabold text-slate-400 bg-slate-100 px-1.5 py-0.5 rounded-md">15개</span>
          </div>
          <button onclick="addExerciseField()" class="text-xs font-bold text-emerald-700 bg-emerald-50 border border-emerald-200 hover:bg-emerald-100 px-2.5 py-1 rounded-xl transition flex items-center gap-1">
            <i data-lucide="plus" class="w-3.5 h-3.5"></i> 동작 추가
          </button>
        </div>
        <div id="exerciseListContainer" class="space-y-2 max-h-52 overflow-y-auto pr-1">
          <!-- 동적으로 생성되는 개별 동작 목록 -->
        </div>
      </div>

      <!-- 옵션 스위치 (음성 & 비프음 및 박진감 비트) -->
      <div class="space-y-2">
        <div class="flex items-center justify-between p-3 bg-slate-50 rounded-2xl border border-slate-200/80">
          <div class="flex items-center gap-2">
            <i data-lucide="volume-2" class="w-4 h-4 text-emerald-600"></i>
            <div>
              <div class="text-xs font-bold text-slate-700">한국어 음성 및 알림음</div>
              <div class="text-[10px] text-slate-400">동작 이름 안내 및 카운트다운 소리</div>
            </div>
          </div>
          <label class="relative inline-flex items-center cursor-pointer">
            <input type="checkbox" id="voiceGuide" checked onchange="saveSettings()" class="sr-only peer">
            <div class="w-11 h-6 bg-slate-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-emerald-500"></div>
          </label>
        </div>

        <div class="flex items-center justify-between p-3 bg-rose-50/50 rounded-2xl border border-rose-200/60">
          <div class="flex items-center gap-2">
            <i data-lucide="activity" class="w-4 h-4 text-rose-600"></i>
            <div>
              <div class="text-xs font-bold text-slate-700">박진감 비트 & 틱 사운드</div>
              <div class="text-[10px] text-slate-400">시간 흐름 리듬음 + 후반부 가속 효과</div>
            </div>
          </div>
          <label class="relative inline-flex items-center cursor-pointer">
            <input type="checkbox" id="beatSound" checked onchange="saveSettings()" class="sr-only peer">
            <div class="w-11 h-6 bg-slate-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-rose-500"></div>
          </label>
        </div>
      </div>

      <!-- 운동 시작 버튼 -->
      <button onclick="startWorkout()" class="w-full py-4 bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-600 hover:to-teal-600 text-white font-extrabold text-lg rounded-2xl shadow-lg shadow-emerald-500/25 transition transform active:scale-98 flex items-center justify-center gap-2">
        <i data-lucide="play" class="w-5 h-5 fill-current"></i> 운동 시작하기
      </button>

    </div>

    <!-- ==================== 2. 타이머 실행 화면 (RUNNING VIEW) ==================== -->
    <div id="timerView" class="hidden p-6 flex flex-col items-center justify-between min-h-[520px] bg-gradient-to-b from-white via-slate-50 to-slate-100">
      
      <!-- 상단 정보 헤더 -->
      <div class="w-full flex items-center justify-between text-xs font-bold text-slate-500">
        <div class="bg-white/90 shadow-sm border border-slate-200 px-3 py-1.5 rounded-full" id="displaySetInfo">
          세트 1 / 1
        </div>
        <div class="bg-white/90 shadow-sm border border-slate-200 px-3 py-1.5 rounded-full" id="displayExInfo">
          동작 1 / 15
        </div>
      </div>

      <!-- 중앙 타이머 & 프로그레스 링 -->
      <div id="timerContainer" class="relative flex items-center justify-center my-4 transition-transform duration-300">
        <svg class="w-64 h-64 sm:w-72 sm:h-72" viewBox="0 0 240 240">
          <circle cx="120" cy="120" r="102" stroke="#f1f5f9" stroke-width="14" fill="none" />
          <circle id="progressCircle" class="progress-ring__circle" cx="120" cy="120" r="102" stroke="#10b981" stroke-width="14" stroke-linecap="round" fill="none" stroke-dasharray="640.88" stroke-dashoffset="0" />
        </svg>

        <!-- 타이머 중앙 텍스트 -->
        <div class="absolute inset-0 flex flex-col items-center justify-center text-center p-4">
          <span id="stateBadge" class="px-3 py-1 rounded-full text-xs font-extrabold tracking-wider uppercase bg-amber-100 text-amber-800 mb-1.5 transition-all">
            준비
          </span>
          <span id="displayTime" class="text-6xl sm:text-7xl font-black tracking-tight text-slate-800 font-mono my-0.5">
            10
          </span>
          <span id="displayExerciseName" class="text-base sm:text-lg font-extrabold text-slate-700 max-w-[190px] truncate">
            준비 운동
          </span>
        </div>
      </div>

      <!-- 다음 동작 미리보기 박스 -->
      <div id="nextBox" class="w-full bg-white/80 backdrop-blur-sm border border-slate-200 rounded-2xl p-3 flex items-center justify-between text-xs">
        <span class="text-slate-400 font-semibold flex items-center gap-1.5">
          <i data-lucide="arrow-right-circle" class="w-4 h-4 text-emerald-600"></i> 다음 순서
        </span>
        <span id="displayNextName" class="font-bold text-slate-700 truncate max-w-[180px]">
          발털기
        </span>
      </div>

      <!-- 조작 버튼 바 (일시정지, 종료) -->
      <div class="w-full grid grid-cols-2 gap-2.5 mt-4">
        <button id="pauseBtn" onclick="togglePause()" class="py-3.5 bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 font-bold rounded-2xl shadow-sm transition active:scale-95 flex items-center justify-center gap-2">
          <i id="pauseIcon" data-lucide="pause" class="w-4 h-4"></i>
          <span id="pauseText">일시정지</span>
        </button>
        <button onclick="stopWorkout()" class="py-3.5 bg-rose-50 border border-rose-200 hover:bg-rose-100 text-rose-600 font-bold rounded-2xl transition active:scale-95 flex items-center justify-center gap-2">
          <i data-lucide="square" class="w-4 h-4"></i> 종료
        </button>
      </div>

    </div>

  </div>

  <!-- 토스트 알림 메시지 팝업 -->
  <div id="toast" class="hidden fixed bottom-8 left-1/2 -translate-x-1/2 bg-slate-800/90 backdrop-blur-md text-white px-5 py-2.5 rounded-full text-xs font-bold shadow-2xl z-50 pointer-events-none flex items-center gap-2">
    <i data-lucide="check" class="w-3.5 h-3.5 text-emerald-400"></i>
    <span id="toastMsg">알림</span>
  </div>

  <script>
    // 4가지 기본 운동 루틴 정의
    const DEFAULT_ROUTINES = {
      '기상전 누워서 스트레칭': {
        workTime: 30,
        restTime: 5,
        setRestTime: 30,
        sets: 1,
        exercises: [
          { name: '발털기', duration: 30 },
          { name: '무릎세워 벌렸다 오므리기', duration: 30 },
          { name: '오른 무릎세워 내외 회전', duration: 30 },
          { name: '왼 무릎세워 내외 회전', duration: 30 },
          { name: '오른 무릎 가슴으로 끌어당기기', duration: 30 },
          { name: '왼 무릎 가슴으로 끌어당기기', duration: 30 },
          { name: '무릎세워 좌우로 트위스트', duration: 30 },
          { name: '오른 무릎에 왼발 올리고 스트레칭', duration: 30 },
          { name: '왼 무릎에 오른발 올리고 스트레칭', duration: 30 },
          { name: '오른 무릎에 왼발 올리고 가슴으로 당기기', duration: 30 },
          { name: '왼 무릎에 오른발 올리고 가슴으로 당기기', duration: 30 },
          { name: '두 무릎 동시에 가슴으로 당기기', duration: 30 },
          { name: '오른발 비둘기 자세', duration: 30 },
          { name: '왼발 비둘기 자세', duration: 30 },
          { name: '개구리 자세', duration: 30 }
        ]
      },
      '점심 후 의자에서 허리 운동': {
        workTime: 30,
        restTime: 10,
        setRestTime: 30,
        sets: 1,
        exercises: [
          { name: '왼발 오른 무릎위 전굴자세', duration: 20 },
          { name: '왼 무릎 세우고 트위스트', duration: 20 },
          { name: '오른발 왼 무릎위 전굴자세', duration: 20 },
          { name: '오른 무릎 세우고 트위스트', duration: 20 },
          { name: '의자에서 레그레이즈', duration: 30 },

    // 전역 상태 변수
    let timerInterval = null;
    let wakeLock = null;
    let isPaused = false;
    
    let workTime = 30;
    let restTime = 10;
    let setRestTime = 30;
    let totalSets = 1;
    let exercises = [];

    // 타이머 진행 변수
    let currentSet = 1;
    let currentEx = 0;
    let currentPhase = 'READY';
    let timeLeft = 10;
    let phaseTotalTime = 10;
    let hasResetForNewRoutine = false;

    const CIRCLE_RADIUS = 102;
    const CIRCLE_CIRCUMFERENCE = 2 * Math.PI * CIRCLE_RADIUS;

    window.addEventListener('DOMContentLoaded', () => {
      initDefaultRoutines();
      updateRoutineSelect();
      loadSavedSettings();
      lucide.createIcons();
    });

    // 기본 루틴을 로컬 스토리지에 확실하게 보장
    function initDefaultRoutines() {
      let savedRoutines = getSavedRoutines();
      let isUpdated = false;
      
      Object.keys(DEFAULT_ROUTINES).forEach(key => {
        if (!savedRoutines[key]) {
          savedRoutines[key] = DEFAULT_ROUTINES[key];
          isUpdated = true;
        }
      });

      if (isUpdated) {
        localStorage.setItem('custom_workout_routines', JSON.stringify(savedRoutines));
      }
    }

    function getSavedRoutines() {
      try {
        return JSON.parse(localStorage.getItem('custom_workout_routines') || '{}');
      } catch {
        return {};
      }
    }

    function updateRoutineSelect() {
      const select = document.getElementById('routineSelect');
      const routines = getSavedRoutines();
      select.innerHTML = '<option value="">-- 루틴 선택 --</option>';
      Object.keys(routines).forEach(name => {
        const opt = document.createElement('option');
        opt.value = name;
        opt.textContent = name;
        select.appendChild(opt);
      });
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      toastMsg.textContent = message;
      toast.classList.remove('hidden', 'toast-animate');
      void toast.offsetWidth;
      toast.classList.add('toast-animate');
      setTimeout(() => {
        toast.classList.add('hidden');
      }, 2500);
    }

    function loadSavedSettings() {
      const saved = localStorage.getItem('custom_timer_config');
      let loaded = false;
      if (saved) {
        try {
          const config = JSON.parse(saved);
          if (Array.isArray(config.exercises) && config.exercises.length > 0) {
            document.getElementById('workTime').value = config.workTime || 30;
            document.getElementById('restTime').value = config.restTime !== undefined ? config.restTime : 10;
            document.getElementById('setRestTime').value = config.setRestTime !== undefined ? config.setRestTime : 30;
            document.getElementById('sets').value = config.sets || 1;
            document.getElementById('voiceGuide').checked = config.voiceGuide !== false;
            if (document.getElementById('beatSound')) {
              document.getElementById('beatSound').checked = config.beatSound !== false;
            }
            exercises = config.exercises.map((item, idx) => {
              if (typeof item === 'string') return { name: item, duration: config.workTime || 30 };
              return { name: item.name || `동작 ${idx + 1}`, duration: item.duration || 30 };
            });
            loaded = true;
          }
        } catch (e) {}
      }
      
      // 초기값이 없으면 1번 '기상전 누워서 스트레칭'을 기본 탑재
      if (!loaded) {
        applyWorkoutPreset('기상전 누워서 스트레칭', false);
      } else {
        renderExerciseInputs();
      }
    }

    function saveSettings() {
      saveExerciseValues();
      const config = {
        workTime: parseInt(document.getElementById('workTime').value) || 30,
        restTime: parseInt(document.getElementById('restTime').value) || 10,
        setRestTime: parseInt(document.getElementById('setRestTime').value) || 30,
        sets: parseInt(document.getElementById('sets').value) || 1,
        voiceGuide: document.getElementById('voiceGuide').checked,
        beatSound: document.getElementById('beatSound') ? document.getElementById('beatSound').checked : true,
        exercises: exercises
      };
      localStorage.setItem('custom_timer_config', JSON.stringify(config));
    }

    function saveExerciseValues() {
      const container = document.getElementById('exerciseListContainer');
      const rows = container.querySelectorAll('.exercise-row');
      rows.forEach((row, idx) => {
        const nameInput = row.querySelector('.exercise-name-input');
        const durInput = row.querySelector('.exercise-dur-input');
        if (nameInput && durInput && exercises[idx]) {
          exercises[idx].name = nameInput.value.trim() || `동작 ${idx + 1}`;
          exercises[idx].duration = parseInt(durInput.value) || 30;
        }
      });
    }

    function applyWorkTimeToAllExercises() {
      const defaultWork = parseInt(document.getElementById('workTime').value) || 30;
      exercises.forEach(ex => {
        ex.duration = defaultWork;
      });
      renderExerciseInputs();
    }

    // 새 루틴 이름 입력란에 텍스트 입력 시 목록 1회 리셋
    function handleRoutineNameInput() {
      const routineInput = document.getElementById('routineName');
      const text = routineInput.value;

      if (text.trim().length > 0 && !hasResetForNewRoutine) {
        document.getElementById('routineSelect').value = '';
        const defaultWork = parseInt(document.getElementById('workTime').value) || 30;
        exercises = Array.from({ length: 5 }, (_, i) => ({
          name: `동작 ${i + 1}`,
          duration: defaultWork
        }));
        renderExerciseInputs();
        saveSettings();
        hasResetForNewRoutine = true;
      } else if (text.trim().length === 0) {
        hasResetForNewRoutine = false;
      }
    }

    // 상단 뱃지 클릭 시 루틴 즉시 교체
    function applyWorkoutPreset(routineName, showNotice = true) {
      const routines = getSavedRoutines();
      const targetRoutine = routines[routineName] || DEFAULT_ROUTINES[routineName];

      if (!targetRoutine) return;
      
      document.getElementById('workTime').value = targetRoutine.workTime || 30;
      document.getElementById('restTime').value = targetRoutine.restTime !== undefined ? targetRoutine.restTime : 10;
      document.getElementById('setRestTime').value = targetRoutine.setRestTime !== undefined ? targetRoutine.setRestTime : 30;
      document.getElementById('sets').value = targetRoutine.sets || 1;
      
      exercises = JSON.parse(JSON.stringify(targetRoutine.exercises));

      // 드롭다운 선택값도 동기화
      const select = document.getElementById('routineSelect');
      if (select) select.value = routineName;
      document.getElementById('routineName').value = '';
      hasResetForNewRoutine = false;

      renderExerciseInputs();
      saveSettings();
      if (showNotice) {
        showToast(`'${routineName}' 루틴이 적용되었습니다.`);
      }
    }

    function renderExerciseInputs() {
      const container = document.getElementById('exerciseListContainer');
      const badge = document.getElementById('exerciseCountBadge');
      if (badge) badge.textContent = `${exercises.length}개`;

      container.innerHTML = '';

      exercises.forEach((item, i) => {
        const defaultName = `동작 ${i + 1}`;
        const itemWrapper = document.createElement('div');
        itemWrapper.className = 'exercise-row flex items-center gap-1.5 w-full bg-slate-50/80 p-1.5 rounded-xl border border-slate-200/80';

        // 번호
        const indexBadge = document.createElement('span');
        indexBadge.className = 'text-xs font-bold text-slate-400 w-5 shrink-0 text-center';
        indexBadge.textContent = `${i + 1}`;

        // 동작 이름
        const nameInput = document.createElement('input');
        nameInput.type = 'text';
        nameInput.value = item.name;
        nameInput.placeholder = defaultName;
        nameInput.className = 'exercise-name-input flex-1 min-w-0 bg-white border border-slate-200 text-slate-700 text-xs font-semibold rounded-lg px-2.5 py-1.5 focus:outline-none focus:ring-2 focus:ring-emerald-400 transition truncate';

        // 포커스 시 디폴트 문구("동작 N")면 비움
        nameInput.addEventListener('focus', function() {
          if (this.value.trim() === defaultName) {
            this.value = '';
          }
        });

        // 포커스 해제 시 공백이면 복원
        nameInput.addEventListener('blur', function() {
          if (this.value.trim() === '') {
            this.value = defaultName;
          }
          exercises[i].name = this.value.trim();
          saveSettings();
        });

        nameInput.addEventListener('input', (e) => {
          exercises[i].name = e.target.value;
        });

        // 개별 시간 박스
        const durWrapper = document.createElement('div');
        durWrapper.className = 'shrink-0 flex items-center gap-1 bg-white border border-rose-200 px-2 py-1 rounded-lg';
        durWrapper.innerHTML = `
          <i data-lucide="flame" class="w-3 h-3 text-rose-500"></i>
          <input type="number" min="5" max="300" value="${item.duration || 30}" class="exercise-dur-input w-8 text-center text-xs font-black text-rose-600 focus:outline-none bg-transparent" title="운동 시간(초)">
          <span class="text-[10px] font-bold text-slate-400">초</span>
        `;

        const durInput = durWrapper.querySelector('.exercise-dur-input');
        durInput.addEventListener('change', (e) => {
          let v = parseInt(e.target.value) || 5;
          if (v < 5) v = 5;
          if (v > 300) v = 300;
          e.target.value = v;
          exercises[i].duration = v;
          saveSettings();
        });

        // 삭제 버튼
        const deleteBtn = document.createElement('button');
        deleteBtn.type = 'button';
        deleteBtn.title = '이 동작 삭제';
        deleteBtn.className = 'shrink-0 p-1.5 text-slate-400 hover:text-rose-500 hover:bg-rose-50 rounded-lg transition flex items-center justify-center';
        deleteBtn.innerHTML = '<i data-lucide="trash-2" class="w-3.5 h-3.5"></i>';
        deleteBtn.onclick = () => removeExerciseField(i);

        itemWrapper.appendChild(indexBadge);
        itemWrapper.appendChild(nameInput);
        itemWrapper.appendChild(durWrapper);
        itemWrapper.appendChild(deleteBtn);
        container.appendChild(itemWrapper);
      });

      lucide.createIcons();
    }

    function addExerciseField() {
      saveExerciseValues();
      if (exercises.length >= 30) {
        showToast('동작은 최대 30개까지 추가할 수 있습니다.');
        return;
      }
      const defaultWork = parseInt(document.getElementById('workTime').value) || 30;
      exercises.push({
        name: `동작 ${exercises.length + 1}`,
        duration: defaultWork
      });
      renderExerciseInputs();
      saveSettings();
    }

    function removeExerciseField(index) {
      if (exercises.length <= 1) {
        showToast('최소 1개 이상의 동작이 필요합니다.');
        return;
      }
      saveExerciseValues();
      exercises.splice(index, 1);
      renderExerciseInputs();
      saveSettings();
    }

    function adjustVal(id, delta, limit) {
      const el = document.getElementById(id);
      let val = parseInt(el.value) + delta;
      if (delta < 0 && val < limit) val = limit;
      if (delta > 0 && val > limit) val = limit;
      el.value = val;
      saveSettings();
    }

        document.getElementById('setRestTime').value = 60;

    function saveRoutine() {
      const nameInput = document.getElementById('routineName');
      const name = nameInput.value.trim();
      if (!name) {
        showToast('저장할 루틴 이름을 입력해주세요.');
        nameInput.focus();
        return;
      }

      saveExerciseValues();
      const routines = getSavedRoutines();
      routines[name] = {
        workTime: parseInt(document.getElementById('workTime').value) || 30,
        restTime: parseInt(document.getElementById('restTime').value) || 10,
        setRestTime: parseInt(document.getElementById('setRestTime').value) || 30,
        sets: parseInt(document.getElementById('sets').value) || 1,
        exercises: JSON.parse(JSON.stringify(exercises))
      };

      localStorage.setItem('custom_workout_routines', JSON.stringify(routines));
      updateRoutineSelect();
      document.getElementById('routineSelect').value = name;
      showToast(`'${name}' 루틴이 저장되었습니다.`);

    function loadSelectedRoutine() {
      const select = document.getElementById('routineSelect');
      const name = select.value;
      if (!name) return;

      document.getElementById('routineName').value = '';
      hasResetForNewRoutine = false;

      const routines = getSavedRoutines();
      const routine = routines[name] || DEFAULT_ROUTINES[name];
      if (routine) {
        document.getElementById('workTime').value = routine.workTime || 30;
        document.getElementById('restTime').value = routine.restTime !== undefined ? routine.restTime : 10;
        document.getElementById('setRestTime').value = routine.setRestTime !== undefined ? routine.setRestTime : 30;
        document.getElementById('sets').value = routine.sets || 1;
        
        exercises = routine.exercises.map((item, idx) => {
          if (typeof item === 'string') {
            return { name: item, duration: routine.workTime || 30 };
          }
          return { name: item.name || `동작 ${idx + 1}`, duration: item.duration || 30 };
        });

        renderExerciseInputs();
        saveSettings();
        showToast(`'${name}' 루틴을 불러왔습니다.`);
      }

    function deleteSelectedRoutine() {
      const select = document.getElementById('routineSelect');
      const name = select.value;
      if (!name) {
        showToast('삭제할 루틴을 먼저 선택해주세요.');
        return;
      }

      if (DEFAULT_ROUTINES[name]) {
        showToast('기본 제공 루틴은 삭제할 수 없습니다.');
        return;
      }

      const routines = getSavedRoutines();
      delete routines[name];
      localStorage.setItem('custom_workout_routines', JSON.stringify(routines));
      updateRoutineSelect();
      showToast(`'${name}' 루틴이 삭제되었습니다.`);
    }

    function speak(text) {
      if (!document.getElementById('voiceGuide').checked) return;
      if (!('speechSynthesis' in window)) return;
      
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'ko-KR';
      utterance.rate = 1.05;
      utterance.pitch = 1.0;
      utterance.volume = 1.0; // 최대 볼륨 보장
      window.speechSynthesis.speak(utterance);
    }

    let globalAudioCtx = null;
    function getAudioCtx() {
      try {
        if (!globalAudioCtx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) globalAudioCtx = new AudioCtx();
        }
        if (globalAudioCtx && globalAudioCtx.state === 'suspended') {
          globalAudioCtx.resume();
        }
        return globalAudioCtx;
      } catch (e) {
        return null;
      }
    }

    function playBeep(freq = 600, duration = 0.18) {
      if (!document.getElementById('voiceGuide').checked) return;
      try {
        const ctx = getAudioCtx();
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        
        // 스마트폰 스피커에서 또렷하게 들리도록 triangle 파형 및 볼륨 증폭
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        
        gain.gain.setValueAtTime(0.85, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + duration);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch (e) {}
    }

    // 운동 중 리듬 틱 및 심장박동 효과음 (스케줄링 지원 및 가속 템포)
    function playHeartbeatTick(type = 'normal', offsetSec = 0) {
      const beatToggle = document.getElementById('beatSound');
      if (beatToggle && !beatToggle.checked) return;

      try {
        const ctx = getAudioCtx();
        if (!ctx) return;
        const startTime = ctx.currentTime + offsetSec;

        if (type === 'normal') {
          // 스마트폰 스피커에서 선명하게 들리는 우드블록/메트로놈 틱 사운드
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(480, startTime);
          osc.frequency.exponentialRampToValueAtTime(160, startTime + 0.07);

          gain.gain.setValueAtTime(0.75, startTime);
          gain.gain.exponentialRampToValueAtTime(0.005, startTime + 0.07);

          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(startTime);
          osc.stop(startTime + 0.08);
        } else if (type === 'urgent') {
          // 마지막 구간 긴박하고 선명한 듀얼 펀치 비트
          const osc1 = ctx.createOscillator();
          const osc2 = ctx.createOscillator();
          const gain = ctx.createGain();

          osc1.type = 'triangle';
          osc1.frequency.setValueAtTime(650, startTime);
          osc1.frequency.exponentialRampToValueAtTime(220, startTime + 0.06);

          osc2.type = 'sine';
          osc2.frequency.setValueAtTime(980, startTime);
          osc2.frequency.exponentialRampToValueAtTime(440, startTime + 0.06);

          gain.gain.setValueAtTime(0.85, startTime);
          gain.gain.exponentialRampToValueAtTime(0.005, startTime + 0.06);

          osc1.connect(gain);
          osc2.connect(gain);
          gain.connect(ctx.destination);
          osc1.start(startTime);
          osc2.start(startTime);
          osc1.stop(startTime + 0.07);
          osc2.stop(startTime + 0.07);
        }
      } catch (e) {}
    }

    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) {}
    }

    function releaseWakeLock() {
      if (wakeLock) {
        wakeLock.release().then(() => { wakeLock = null; });
      }
    }

    function startWorkout() {
      saveExerciseValues();
      saveSettings();

      if (!exercises || exercises.length === 0) {
        showToast('운동 동작을 최소 1개 이상 추가해주세요.');
        return;
      }

      workTime = parseInt(document.getElementById('workTime').value) || 30;
      restTime = parseInt(document.getElementById('restTime').value) || 10;
      setRestTime = parseInt(document.getElementById('setRestTime').value) || 30;
      totalSets = parseInt(document.getElementById('sets').value) || 1;

      document.getElementById('setupView').classList.add('hidden');
      document.getElementById('timerView').classList.remove('hidden');

      requestWakeLock();
      isPaused = false;
      updatePauseUI();

      currentSet = 1;
      currentEx = 0;
      currentPhase = 'READY';
      timeLeft = 10;
      phaseTotalTime = 10;

      updateTimerDisplay();
      speak("운동을 준비하세요. 10초 전");

      clearInterval(timerInterval);
      timerInterval = setInterval(timerTick, 1000);
    }

    function timerTick() {
      if (isPaused) return;

      timeLeft--;

      // 운동 중 박진감 가속 비트 사운드 처리 (10초 전: 0.5초 단위 / 5초 전: 0.25초 단위)
      if (currentPhase === 'WORK' && timeLeft >= 0) {
        if (timeLeft > 10) {
          // 기본: 1초 단위 (1회)
          playHeartbeatTick('normal', 0);
        } else if (timeLeft <= 10 && timeLeft > 5) {
          // 10초 이하: 0.5초 단위 (초당 2회)
          playHeartbeatTick('normal', 0);
          playHeartbeatTick('normal', 0.5);
        } else if (timeLeft <= 5 && timeLeft > 0) {
          // 5초 이하: 0.25초 단위 (초당 4회 가속 템포)
          playHeartbeatTick('urgent', 0);
          playHeartbeatTick('urgent', 0.25);
          playHeartbeatTick('urgent', 0.5);
          playHeartbeatTick('urgent', 0.75);
        }
      }

      // 마지막 3, 2, 1초 카운트다운 비프음
      if (timeLeft <= 3 && timeLeft > 0) {
        if (currentPhase === 'WORK') {
          playBeep(660 + (3 - timeLeft) * 120, 0.12); // 3초부터 음정이 점점 높아지며 긴장감 고조
        } else {
          playBeep(440, 0.1);
        }
      }

      if (timeLeft < 0) {
        handlePhaseTransition();
      } else {
        updateTimerDisplay();
      }
    }

    function handlePhaseTransition() {
      const totalExCount = exercises.length;

      if (currentPhase === 'READY') {
        currentPhase = 'WORK';
        currentEx = 1;
        const targetDuration = exercises[0]?.duration || workTime;
        timeLeft = targetDuration;
        phaseTotalTime = targetDuration;
        playBeep(880, 0.3);
        speak(`${exercises[0].name}, 시작!`);
      } 
      else if (currentPhase === 'WORK') {
        if (currentEx === totalExCount) {
          if (currentSet === totalSets) {
            finishWorkout();
            return;
          }

          currentSet++;
          currentEx = 1;

          if (setRestTime > 0) {
            currentPhase = 'SET_REST';
            timeLeft = setRestTime;
            phaseTotalTime = setRestTime;
            playBeep(520, 0.3);
            speak(`세트 휴식 시간입니다. 다음은 ${currentSet}세트, ${exercises[0].name}`);
          } else {
            currentPhase = 'WORK';
            const targetDuration = exercises[0]?.duration || workTime;
            timeLeft = targetDuration;
            phaseTotalTime = targetDuration;
            playBeep(880, 0.3);
            speak(`${currentSet}세트 시작! ${exercises[0].name}`);
          }
        } 
        else {
          currentEx++;
          if (restTime > 0) {
            currentPhase = 'REST';
            timeLeft = restTime;
            phaseTotalTime = restTime;
            playBeep(520, 0.3);
            speak(`휴식 시간입니다. 다음은 ${exercises[currentEx - 1].name}`);
          } else {
            currentPhase = 'WORK';
            const targetDuration = exercises[currentEx - 1]?.duration || workTime;
            timeLeft = targetDuration;
            phaseTotalTime = targetDuration;
            playBeep(880, 0.3);
            speak(`${exercises[currentEx - 1].name}, 시작!`);
          }
        }
      } 
      else if (currentPhase === 'REST' || currentPhase === 'SET_REST') {
        currentPhase = 'WORK';
        const targetDuration = exercises[currentEx - 1]?.duration || workTime;
        timeLeft = targetDuration;
        phaseTotalTime = targetDuration;
        playBeep(880, 0.3);
        speak(`${exercises[currentEx - 1].name}, 시작!`);
      }

      updateTimerDisplay();
    }

    function finishWorkout() {
      clearInterval(timerInterval);
      releaseWakeLock();

      currentPhase = 'FINISHED';
      const container = document.getElementById('timerContainer');
      if (container) {
        container.classList.remove('pulse-rhythm', 'pulse-urgent');
      }

      document.getElementById('stateBadge').textContent = '운동 완료 🎉';
      document.getElementById('stateBadge').className = 'px-3 py-1 rounded-full text-xs font-extrabold tracking-wider uppercase bg-emerald-100 text-emerald-800 mb-1.5';
      document.getElementById('displayTime').textContent = '완료!';
      document.getElementById('displayExerciseName').textContent = '수고하셨습니다!';
      document.getElementById('nextBox').classList.add('hidden');
      
      const circle = document.getElementById('progressCircle');
      circle.style.strokeDashoffset = 0;
      circle.setAttribute('stroke', '#10b981');

      playBeep(880, 0.5);
      speak("모든 운동을 완료했습니다. 정말 수고하셨습니다!");
    }

    function updateTimerDisplay() {
      const badge = document.getElementById('stateBadge');
      const timeText = document.getElementById('displayTime');
      const exName = document.getElementById('displayExerciseName');
      const nextName = document.getElementById('displayNextName');
      const setInfo = document.getElementById('displaySetInfo');
      const exInfo = document.getElementById('displayExInfo');
      const circle = document.getElementById('progressCircle');
      const nextBox = document.getElementById('nextBox');
      const container = document.getElementById('timerContainer');
      const totalExCount = exercises.length;

      nextBox.classList.remove('hidden');
      timeText.textContent = timeLeft;
      setInfo.textContent = `세트 ${currentSet} / ${totalSets}`;

      // 펄스 애니메이션 초기화
      if (container) {
        container.classList.remove('pulse-rhythm', 'pulse-urgent');
      }

      if (currentPhase === 'READY') {
        badge.textContent = '준비';
        badge.className = 'px-3 py-1 rounded-full text-xs font-extrabold tracking-wider uppercase bg-amber-100 text-amber-800 mb-1.5';
        exName.textContent = '준비';
        exInfo.textContent = '운동 시작 준비';
        nextName.textContent = exercises[0]?.name || '1번 동작';
        circle.setAttribute('stroke', '#f59e0b');
      } else if (currentPhase === 'WORK') {
        if (timeLeft <= 5) {
          badge.textContent = '스퍼트! 🔥';
          badge.className = 'px-3 py-1 rounded-full text-xs font-extrabold tracking-wider uppercase bg-rose-600 text-white animate-bounce mb-1.5 shadow-md shadow-rose-500/40';
          if (container) container.classList.add('pulse-urgent');
        } else {
          badge.textContent = '운동 중 🔥';
          badge.className = 'px-3 py-1 rounded-full text-xs font-extrabold tracking-wider uppercase bg-rose-100 text-rose-700 mb-1.5';
          if (container) container.classList.add('pulse-rhythm');
        }

        exName.textContent = exercises[currentEx - 1]?.name || `동작 ${currentEx}`;
        exInfo.textContent = `동작 ${currentEx} / ${totalExCount}`;
        
        if (currentEx < totalExCount) {
          nextName.textContent = exercises[currentEx]?.name || '';
        } else if (currentSet < totalSets) {
          nextName.textContent = `[다음 ${currentSet + 1}세트] ${exercises[0]?.name || ''}`;
        } else {
          nextName.textContent = '마지막 동작입니다!';
        }
        circle.setAttribute('stroke', timeLeft <= 5 ? '#dc2626' : '#ef4444');
      } else if (currentPhase === 'REST') {
        badge.textContent = '동작 휴식 ☕';
        badge.className = 'px-3 py-1 rounded-full text-xs font-extrabold tracking-wider uppercase bg-blue-100 text-blue-700 mb-1.5';
        exName.textContent = '숨 고르기';
        exInfo.textContent = `동작 ${currentEx} / ${totalExCount}`;
        nextName.textContent = exercises[currentEx - 1]?.name || '';
        circle.setAttribute('stroke', '#3b82f6');
      } else if (currentPhase === 'SET_REST') {
        badge.textContent = '세트 휴식 ⏳';
        badge.className = 'px-3 py-1 rounded-full text-xs font-extrabold tracking-wider uppercase bg-indigo-100 text-indigo-700 mb-1.5';
        exName.textContent = `${currentSet}세트 준비`;
        exInfo.textContent = `동작 1 / ${totalExCount}`;
        nextName.textContent = exercises[0]?.name || '';
        circle.setAttribute('stroke', '#6366f1');
      }

      const fraction = phaseTotalTime > 0 ? (timeLeft / phaseTotalTime) : 0;
      const offset = CIRCLE_CIRCUMFERENCE * (1 - fraction);
      circle.style.strokeDashoffset = offset;
    }

    function togglePause() {
      isPaused = !isPaused;
      updatePauseUI();
    }

    function updatePauseUI() {
      const pauseText = document.getElementById('pauseText');
      const pauseIcon = document.getElementById('pauseIcon');
      if (isPaused) {
        pauseText.textContent = '계속 진행';
        pauseIcon.setAttribute('data-lucide', 'play');
      } else {
        pauseText.textContent = '일시정지';
        pauseIcon.setAttribute('data-lucide', 'pause');
      }
      lucide.createIcons();
    }

    function stopWorkout() {
      clearInterval(timerInterval);
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      releaseWakeLock();

      document.getElementById('timerView').classList.add('hidden');
      document.getElementById('setupView').classList.remove('hidden');
    }
  </script>
</body>
</html>
