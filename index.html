<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>맞춤 유산소 루틴 타이머</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800;900&display=swap');
    
    * {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    /* 원형 프로그레스 바 애니메이션 */
    .progress-ring__circle {
      transition: stroke-dashoffset 0.3s linear, stroke 0.3s ease;
      transform: rotate(-90deg);
      transform-origin: 50% 50%;
    }

    /* 숫자 입력 스핀 버튼 제거 */
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { 
      -webkit-appearance: none; 
      margin: 0; 
    }
    input[type=number] {
      -moz-appearance: textfield;
    }

    /* 펄스 애니메이션 */
    @keyframes subtlePulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.02); opacity: 0.92; }
    }
    @keyframes urgentPulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 16px rgba(239, 68, 68, 0.6)); }
      50% { transform: scale(1.05); filter: drop-shadow(0 0 28px rgba(239, 68, 68, 0.9)); }
    }

    .pulse-rhythm {
      animation: subtlePulse 1s infinite ease-in-out;
    }
    .pulse-urgent {
      animation: urgentPulse 0.25s infinite ease-in-out;
    }

    /* 토스트 팝업 애니메이션 */
    .toast-animate {
      animation: fadeInOut 2.5s forwards cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes fadeInOut {
      0% { opacity: 0; transform: translate(-50%, 20px) scale(0.95); }
      15% { opacity: 1; transform: translate(-50%, 0) scale(1); }
      80% { opacity: 1; transform: translate(-50%, 0) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -10px) scale(0.95); }
    }

    /* 가로 스크롤바 숨김 */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col items-center justify-center p-3 sm:p-5 selection:bg-emerald-500 selection:text-white">

  <!-- 메인 컨테이너 -->
  <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl shadow-slate-300/70 border border-slate-200/80 overflow-hidden relative">

    <!-- ==================== 1. 설정 화면 (SETUP VIEW) ==================== -->
    <div id="setupView" class="p-4 sm:p-6 space-y-4">
      
      <!-- 헤더 -->
      <div class="flex items-center justify-between pb-3 border-b border-slate-100">
        <div class="flex items-center gap-2.5">
          <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center text-white shadow-md shadow-emerald-500/20">
            <i data-lucide="timer" class="w-5 h-5"></i>
          </div>
          <div>
            <h1 class="text-xl font-black text-slate-800 tracking-tight">맞춤 루틴 타이머</h1>
            <p class="text-xs text-slate-400 font-medium">유산소 & 인터벌 스트레칭</p>
          </div>
        </div>
      </div>

      <!-- 추천 프리셋 버튼 (한 줄 가로 배치) -->
      <div class="bg-slate-50/80 p-3 rounded-2xl border border-slate-200/80 space-y-2">
        <div class="text-[11px] font-bold text-slate-400 flex items-center gap-1">
          <i data-lucide="sparkles" class="w-3.5 h-3.5 text-emerald-500"></i> 추천 루틴 바로가기
        </div>
        <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5">
          <button onclick="applyWorkoutPreset('morning')" class="shrink-0 py-1.5 px-3 rounded-xl text-xs font-extrabold bg-emerald-100/80 text-emerald-800 hover:bg-emerald-200 border border-emerald-200/60 transition active:scale-95 text-center whitespace-nowrap">기상전</button>
          <button onclick="applyWorkoutPreset('lunch')" class="shrink-0 py-1.5 px-3 rounded-xl text-xs font-extrabold bg-blue-100/80 text-blue-800 hover:bg-blue-200 border border-blue-200/60 transition active:scale-95 text-center whitespace-nowrap">점심의자</button>
          <button onclick="applyWorkoutPreset('night')" class="shrink-0 py-1.5 px-3 rounded-xl text-xs font-extrabold bg-indigo-100/80 text-indigo-800 hover:bg-indigo-200 border border-indigo-200/60 transition active:scale-95 text-center whitespace-nowrap">취침전</button>
          <button onclick="applyWorkoutPreset('squat')" class="shrink-0 py-1.5 px-3 rounded-xl text-xs font-extrabold bg-violet-100/80 text-violet-800 hover:bg-violet-200 border border-violet-200/60 transition active:scale-95 text-center whitespace-nowrap">하체</button>
          <button onclick="applyWorkoutPreset('belly')" class="shrink-0 py-1.5 px-3 rounded-xl text-xs font-extrabold bg-rose-100/80 text-rose-800 hover:bg-rose-200 border border-rose-200/60 transition active:scale-95 text-center whitespace-nowrap">서서뱃살</button>
          <button onclick="applyWorkoutPreset('abs')" class="shrink-0 py-1.5 px-3 rounded-xl text-xs font-extrabold bg-pink-100/80 text-pink-800 hover:bg-pink-200 border border-pink-200/60 transition active:scale-95 text-center whitespace-nowrap">누워뱃살</button>
          <button onclick="applyWorkoutPreset('plank')" class="shrink-0 py-1.5 px-3 rounded-xl text-xs font-extrabold bg-amber-100/80 text-amber-800 hover:bg-amber-200 border border-amber-200/60 transition active:scale-95 text-center whitespace-nowrap">전신(플랭크)</button>
        </div>
      </div>

      <!-- 예상 총 소요시간 및 운동시간 요약 카드 -->
      <div class="grid grid-cols-2 gap-2 bg-gradient-to-r from-emerald-50 to-teal-50 p-3 rounded-2xl border border-emerald-100/80">
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-xl bg-emerald-100 flex items-center justify-center text-emerald-600 shrink-0">
            <i data-lucide="clock" class="w-4 h-4"></i>
          </div>
          <div>
            <div class="text-[10px] font-bold text-slate-400">전체 소요시간</div>
            <div id="setupTotalDurationText" class="text-xs sm:text-sm font-black text-emerald-700">0분 00초</div>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-xl bg-rose-100 flex items-center justify-center text-rose-600 shrink-0">
            <i data-lucide="zap" class="w-4 h-4"></i>
          </div>
          <div>
            <div class="text-[10px] font-bold text-slate-400">순수 운동시간</div>
            <div id="setupWorkDurationText" class="text-xs sm:text-sm font-black text-rose-700">0분 00초</div>
          </div>
        </div>
      </div>

      <!-- 루틴 관리 섹션 (드롭다운 & 새 루틴 이름 저장) -->
      <div class="bg-slate-50/80 p-3.5 rounded-2xl border border-slate-200/80 space-y-2.5">
        <div class="flex items-center justify-between">
          <span class="text-xs font-bold text-slate-500 flex items-center gap-1.5">
            <i data-lucide="folder-heart" class="w-4 h-4 text-emerald-600"></i> 루틴 관리
          </span>
        </div>

        <!-- 루틴 불러오기 / 삭제 -->
        <div class="flex gap-1.5 items-center w-full">
          <div class="relative flex-1 min-w-0">
            <select id="routineSelect" onchange="loadSelectedRoutine()" class="w-full bg-white border border-slate-200 text-slate-700 text-xs sm:text-sm font-semibold rounded-xl px-3 py-2 pr-8 appearance-none focus:outline-none focus:ring-2 focus:ring-emerald-400 truncate">
              <option value="">-- 루틴 선택 --</option>
            </select>
            <i data-lucide="chevron-down" class="w-4 h-4 text-slate-400 absolute right-2.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
          </div>
          <button onclick="deleteSelectedRoutine()" title="선택 루틴 삭제" class="shrink-0 p-2 text-rose-500 hover:text-rose-700 hover:bg-rose-50 rounded-xl transition border border-slate-200/60 flex items-center justify-center">
            <i data-lucide="trash-2" class="w-4 h-4"></i>
          </button>
        </div>

        <!-- 현재 루틴 저장/수정 -->
        <div class="flex gap-1.5 items-center w-full">
          <input type="text" id="routineName" oninput="handleRoutineNameInput()" placeholder="새 루틴 이름 입력..." class="flex-1 min-w-0 bg-white border border-slate-200 text-slate-700 text-xs sm:text-sm font-medium rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-400">
          <button onclick="saveRoutine()" class="shrink-0 px-3.5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-xs sm:text-sm font-bold rounded-xl shadow-sm transition active:scale-95 flex items-center gap-1">
            <i data-lucide="save" class="w-3.5 h-3.5"></i> 저장
          </button>
        </div>
      </div>

      <!-- 타이머 기본 설정 그리드 -->
      <div class="grid grid-cols-2 gap-2.5">
        <!-- 기본 운동 시간 -->
        <div class="bg-rose-50/60 p-3 rounded-2xl border border-rose-100 flex flex-col justify-between">
          <div class="flex items-center gap-1.5 text-xs font-bold text-rose-600 mb-1">
            <i data-lucide="flame" class="w-3.5 h-3.5"></i> 기본 운동시간(초)
          </div>
          <div class="flex items-center justify-between mt-1">
            <button onclick="adjustVal('workTime', -5, 5); applyWorkTimeToAll();" class="w-7 h-7 rounded-lg bg-white border border-rose-200 text-rose-600 flex items-center justify-center font-bold text-base active:scale-90 shadow-sm">−</button>
            <input type="number" id="workTime" value="30" min="5" max="300" onchange="applyWorkTimeToAll(); saveSettings();" class="w-12 bg-transparent text-center font-black text-rose-600 text-lg focus:outline-none">
            <button onclick="adjustVal('workTime', 5, 300); applyWorkTimeToAll();" class="w-7 h-7 rounded-lg bg-white border border-rose-200 text-rose-600 flex items-center justify-center font-bold text-base active:scale-90 shadow-sm">+</button>
          </div>
        </div>

        <!-- 동작 간 휴식 시간 -->
        <div class="bg-blue-50/60 p-3 rounded-2xl border border-blue-100 flex flex-col justify-between">
          <div class="flex items-center gap-1.5 text-xs font-bold text-blue-600 mb-1">
            <i data-lucide="coffee" class="w-3.5 h-3.5"></i> 동작 간 휴식(초)
          </div>
          <div class="flex items-center justify-between mt-1">
            <button onclick="adjustVal('restTime', -5, 0)" class="w-7 h-7 rounded-lg bg-white border border-blue-200 text-blue-600 flex items-center justify-center font-bold text-base active:scale-90 shadow-sm">−</button>
            <input type="number" id="restTime" value="0" min="0" max="180" onchange="saveSettings()" class="w-12 bg-transparent text-center font-black text-blue-600 text-lg focus:outline-none">
            <button onclick="adjustVal('restTime', 5, 180)" class="w-7 h-7 rounded-lg bg-white border border-blue-200 text-blue-600 flex items-center justify-center font-bold text-base active:scale-90 shadow-sm">+</button>
          </div>
        </div>

        <!-- 세트 수 -->
        <div class="bg-amber-50/60 p-3 rounded-2xl border border-amber-100 flex flex-col justify-between">
          <div class="flex items-center gap-1.5 text-xs font-bold text-amber-700 mb-1">
            <i data-lucide="repeat" class="w-3.5 h-3.5"></i> 세트 수
          </div>
          <div class="flex items-center justify-between mt-1">
            <button onclick="adjustVal('sets', -1, 1)" class="w-7 h-7 rounded-lg bg-white border border-amber-200 text-amber-700 flex items-center justify-center font-bold text-base active:scale-90 shadow-sm">−</button>
            <input type="number" id="sets" value="1" min="1" max="20" onchange="saveSettings()" class="w-12 bg-transparent text-center font-black text-amber-700 text-lg focus:outline-none">
            <button onclick="adjustVal('sets', 1, 20)" class="w-7 h-7 rounded-lg bg-white border border-amber-200 text-amber-700 flex items-center justify-center font-bold text-base active:scale-90 shadow-sm">+</button>
          </div>
        </div>

        <!-- 세트 간 휴식 시간 -->
        <div class="bg-purple-50/60 p-3 rounded-2xl border border-purple-100 flex flex-col justify-between">
          <div class="flex items-center gap-1.5 text-xs font-bold text-purple-700 mb-1">
            <i data-lucide="hourglass" class="w-3.5 h-3.5"></i> 세트 간 휴식(초)
          </div>
          <div class="flex items-center justify-between mt-1">
            <button onclick="adjustVal('setRestTime', -5, 0)" class="w-7 h-7 rounded-lg bg-white border border-purple-200 text-purple-700 flex items-center justify-center font-bold text-base active:scale-90 shadow-sm">−</button>
            <input type="number" id="setRestTime" value="30" min="0" max="300" onchange="saveSettings()" class="w-12 bg-transparent text-center font-black text-purple-700 text-lg focus:outline-none">
            <button onclick="adjustVal('setRestTime', 5, 300)" class="w-7 h-7 rounded-lg bg-white border border-purple-200 text-purple-700 flex items-center justify-center font-bold text-base active:scale-90 shadow-sm">+</button>
          </div>
        </div>
      </div>

      <!-- 숨겨진 전체 개수 인풋 -->
      <input type="hidden" id="exercises" value="5">

      <!-- 세부 동작 리스트 -->
      <div class="space-y-2">
        <div class="flex items-center justify-between">
          <label class="text-xs font-bold text-slate-500 flex items-center gap-1.5">
            <i data-lucide="dumbbell" class="w-3.5 h-3.5 text-emerald-600"></i> 동작별 이름 및 개별 시간
          </label>
          <button onclick="addExerciseFieldAtCursor()" class="text-xs font-bold text-emerald-700 bg-emerald-50 border border-emerald-200 hover:bg-emerald-100 px-2.5 py-1 rounded-xl transition flex items-center gap-1 shadow-sm">
            <i data-lucide="plus" class="w-3.5 h-3.5"></i> 동작 추가
          </button>
        </div>
        <div id="exerciseListContainer" class="space-y-1.5 max-h-52 overflow-y-auto pr-1">
          <!-- 동적 리스트 렌더링 -->
        </div>
      </div>

      <!-- 옵션 토글들 -->
      <div class="space-y-2 pt-1">
        <!-- 음성 가이드 -->
        <div class="flex items-center justify-between p-3 bg-slate-50 rounded-2xl border border-slate-200/80">
          <div class="flex items-center gap-2">
            <i data-lucide="volume-2" class="w-4 h-4 text-emerald-600"></i>
            <div>
              <div class="text-xs font-bold text-slate-700">한국어 음성 및 알림음</div>
              <div class="text-[10px] text-slate-400">동작 이름 음성 안내 및 비프음</div>
            </div>
          </div>
          <label class="relative inline-flex items-center cursor-pointer">
            <input type="checkbox" id="voiceGuide" checked onchange="saveSettings()" class="sr-only peer">
            <div class="w-11 h-6 bg-slate-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-emerald-500"></div>
          </label>
        </div>

        <!-- 심장박동 가속 비트 -->
        <div class="flex items-center justify-between p-3 bg-slate-50 rounded-2xl border border-slate-200/80">
          <div class="flex items-center gap-2">
            <i data-lucide="heart-pulse" class="w-4 h-4 text-rose-500"></i>
            <div>
              <div class="text-xs font-bold text-slate-700">가속 심장박동 비트음</div>
              <div class="text-[10px] text-slate-400">10초전(0.5초), 5초전(0.25초) 가속</div>
            </div>
          </div>
          <label class="relative inline-flex items-center cursor-pointer">
            <input type="checkbox" id="beatSound" checked onchange="saveSettings()" class="sr-only peer">
            <div class="w-11 h-6 bg-slate-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-rose-500"></div>
          </label>
        </div>
      </div>

      <!-- 운동 시작 버튼 -->
      <button onclick="startWorkout()" class="w-full py-4 bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-600 hover:to-teal-600 text-white font-extrabold text-lg rounded-2xl shadow-lg shadow-emerald-500/25 transition transform active:scale-98 flex items-center justify-center gap-2">
        <i data-lucide="play" class="w-5 h-5 fill-current"></i> 운동 시작하기
      </button>

    </div>

    <!-- ==================== 2. 타이머 실행 화면 (RUNNING VIEW) ==================== -->
    <div id="timerView" class="hidden p-5 flex flex-col items-center justify-between min-h-[550px] bg-gradient-to-b from-white via-slate-50 to-slate-100">
      
      <!-- 최상단 루틴 이름 표시 -->
      <div class="w-full flex items-center justify-between pb-2 border-b border-slate-200/70">
        <div class="flex items-center gap-1.5">
          <i data-lucide="dumbbell" class="w-4 h-4 text-emerald-600"></i>
          <span id="displayRoutineNameText" class="text-sm font-black text-slate-800 truncate max-w-[220px]">맞춤 루틴</span>
        </div>
        <span class="text-[10px] font-extrabold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800">PLAYING</span>
      </div>

      <!-- 누적 시간 및 세트/동작 정보 헤더 -->
      <div class="w-full space-y-2 mt-2">
        <div class="grid grid-cols-2 gap-2 text-center">
          <div class="bg-white/90 border border-slate-200 p-2 rounded-2xl shadow-xs">
            <div class="text-[10px] font-bold text-slate-400">전체 소요시간</div>
            <div id="displayTotalElapsed" class="text-xs font-black text-slate-700 font-mono">00:00 / 00:00</div>
          </div>
          <div class="bg-white/90 border border-slate-200 p-2 rounded-2xl shadow-xs">
            <div class="text-[10px] font-bold text-rose-500">순수 운동시간</div>
            <div id="displayWorkElapsed" class="text-xs font-black text-rose-600 font-mono">00:00 / 00:00</div>
          </div>
        </div>

        <div class="flex items-center justify-between text-xs font-bold text-slate-500">
          <div class="bg-white/90 shadow-sm border border-slate-200 px-3 py-1.5 rounded-full" id="displaySetInfo">
            세트 1 / 1
          </div>
          <div class="bg-white/90 shadow-sm border border-slate-200 px-3 py-1.5 rounded-full" id="displayExInfo">
            동작 1 / 5
          </div>
        </div>
      </div>

      <!-- 중앙 원형 타이머 -->
      <div class="relative flex items-center justify-center my-3" id="circleContainer">
        <!-- SVG 프로그레스 원 -->
        <svg class="w-64 h-64 sm:w-72 sm:h-72" viewBox="0 0 240 240">
          <circle cx="120" cy="120" r="102" stroke="#f1f5f9" stroke-width="14" fill="none" />
          <circle id="progressCircle" class="progress-ring__circle" cx="120" cy="120" r="102" stroke="#10b981" stroke-width="14" stroke-linecap="round" fill="none" stroke-dasharray="640.88" stroke-dashoffset="0" />
        </svg>

        <!-- 타이머 중앙 텍스트 -->
        <div class="absolute inset-0 flex flex-col items-center justify-center text-center p-4">
          <span id="stateBadge" class="px-3 py-1 rounded-full text-xs font-extrabold tracking-wider uppercase bg-amber-100 text-amber-800 mb-1">
            준비
          </span>
          <span id="displayTime" class="text-6xl sm:text-7xl font-black tracking-tight text-slate-800 font-mono my-0.5">
            10
          </span>
          <span id="displayExerciseName" class="text-base sm:text-lg font-black text-slate-700 max-w-[190px] leading-tight break-keep px-2">
            운동 준비
          </span>
        </div>
      </div>

      <!-- 다음 동작 강조 박스 (폰트 크기 대폭 확대: 2xl ~ 3xl) -->
      <div id="nextBox" class="w-full bg-gradient-to-r from-emerald-500 to-teal-600 rounded-2xl p-3.5 sm:p-4 shadow-md text-white flex flex-col gap-1 border border-emerald-400">
        <div class="flex items-center justify-between">
          <span class="bg-white/20 backdrop-blur-sm px-2.5 py-0.5 rounded-lg text-[11px] font-black uppercase tracking-wider text-emerald-100 flex items-center gap-1">
            <i data-lucide="arrow-right-circle" class="w-3.5 h-3.5"></i> NEXT STEP
          </span>
          <span class="text-[10px] text-emerald-100/80 font-semibold">다음 순서 미리보기</span>
        </div>
        <div id="displayNextName" class="font-black text-2xl sm:text-3xl text-left truncate text-white drop-shadow-md py-0.5">
          동작 1
        </div>
      </div>

      <!-- 제어 버튼 (일시정지, 건너뛰기, 종료: 3열 배치) -->

    window.addEventListener('DOMContentLoaded', () => {
      cleanAndSyncRoutines();

    // 시간 포맷 헬퍼 (초 -> MM:SS 또는 M분 S초)
    function formatTimeSec(seconds, format = 'colon') {
      const sec = Math.max(0, Math.floor(seconds));
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      if (format === 'colon') {
        return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      }
      if (m === 0) return `${s}초`;
      return `${m}분 ${String(s).padStart(2, '0')}초`;
    }

    // 전체 소요시간 및 운동시간 계산 함수
    function calculateRoutineDurations() {
      const sCount = parseInt(document.getElementById('sets').value) || 1;
      const rTime = parseInt(document.getElementById('restTime').value) || 0;
      const srTime = parseInt(document.getElementById('setRestTime').value) || 0;
      
      const singleSetWorkTime = exercises.reduce((acc, cur) => {
        return acc + (parseInt(cur.time) || defaultWorkTime);
      }, 0);

      const totalWorkTime = singleSetWorkTime * sCount;

      // 1세트 내 동작 간 휴식: (동작 수 - 1) * 휴식시간
      const singleSetRestTime = exercises.length > 1 ? (exercises.length - 1) * rTime : 0;
      const totalExRestTime = singleSetRestTime * sCount;

      // 세트 간 휴식: (세트 수 - 1) * 세트 휴식시간
      const totalSetRestTime = sCount > 1 ? (sCount - 1) * srTime : 0;

      // 총 소요시간 = 준비시간(10초) + 전체 운동시간 + 동작 간 휴식 + 세트 간 휴식
      const totalDuration = 10 + totalWorkTime + totalExRestTime + totalSetRestTime;

      return {
        totalDuration,
        totalWorkTime
      };
    }

    // 설정 화면 소요시간 표시 업데이트
    function updateDurationSummaries() {
      const durations = calculateRoutineDurations();
      plannedTotalSeconds = durations.totalDuration;
      plannedWorkSeconds = durations.totalWorkTime;

      const totalTextEl = document.getElementById('setupTotalDurationText');
      const workTextEl = document.getElementById('setupWorkDurationText');

      if (totalTextEl) totalTextEl.textContent = formatTimeSec(plannedTotalSeconds, 'korean');
      if (workTextEl) workTextEl.textContent = formatTimeSec(plannedWorkSeconds, 'korean');
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      toastMsg.textContent = message;
      toast.classList.remove('hidden', 'toast-animate');
      void toast.offsetWidth;
      toast.classList.add('toast-animate');
      setTimeout(() => {
        toast.classList.add('hidden');
      }, 2500);
    }

    // 로컬 스토리지에 남아있던 과거 중복/오타 루틴 키를 말끔히 정리하고 5대 루틴과 동기화
    function cleanAndSyncRoutines() {
      const routines = getSavedRoutines();
      const legacyKeys = ['전신 운동 (Plank)', '전신 운동', 'fullBody', 'lowerBody', 'core', '기상전', '점심의자', '취침전', '뱃살빼기', '전신(플랭크)'];
      
      legacyKeys.forEach(k => {
        if (routines[k]) delete routines[k];
      });

      // 5대 기본 루틴 데이터 갱신
      Object.values(WORKOUT_PRESETS).forEach(preset => {
        routines[preset.name] = {
          workTime: preset.workTime,
          restTime: preset.restTime,
          sets: preset.sets,
          setRestTime: preset.setRestTime,
          exercises: [...preset.exercises],
          isDefault: true
        };
      });

      localStorage.setItem('custom_workout_routines', JSON.stringify(routines));
    }

    function getSavedRoutines() {
      try {
        return JSON.parse(localStorage.getItem('custom_workout_routines') || '{}');
      } catch {
        return {};
      }
    }

    // 드롭다운 목록을 '기본 추천 루틴'과 '사용자 루틴'으로 명확히 구분 및 중복 배제
    function updateRoutineSelect() {
      const select = document.getElementById('routineSelect');
      const routines = getSavedRoutines();
      const currentSelected = select.value;
      
      select.innerHTML = '<option value="">-- 루틴 선택 --</option>';

      // 1. 기본 추천 루틴 그룹
      const defaultGroup = document.createElement('optgroup');
      defaultGroup.label = '⭐ 기본 추천 루틴';
      DEFAULT_PRESET_NAMES.forEach(name => {
        const opt = document.createElement('option');
        opt.value = name;
        opt.textContent = name;
        defaultGroup.appendChild(opt);
      });
      select.appendChild(defaultGroup);

      // 2. 사용자 맞춤 루틴 그룹 (기본 루틴 외 추가된 루틴만 표시)
      const userRoutineNames = Object.keys(routines).filter(name => !DEFAULT_PRESET_NAMES.includes(name));
      if (userRoutineNames.length > 0) {
        const userGroup = document.createElement('optgroup');
        userGroup.label = '📁 내가 저장한 루틴';
        userRoutineNames.forEach(name => {
          const opt = document.createElement('option');
          opt.value = name;
          opt.textContent = name;
          userGroup.appendChild(opt);
        });
        select.appendChild(userGroup);
      }

      if (currentSelected && routines[currentSelected]) {
        select.value = currentSelected;
      }
    }

    function loadSavedSettings() {
      const saved = localStorage.getItem('custom_timer_config');
      if (saved) {
        try {
          const config = JSON.parse(saved);
          document.getElementById('workTime').value = config.workTime || 30;
          document.getElementById('restTime').value = config.restTime !== undefined ? config.restTime : 0;
          document.getElementById('sets').value = config.sets || 1;
          document.getElementById('setRestTime').value = config.setRestTime !== undefined ? config.setRestTime : 30;
          document.getElementById('voiceGuide').checked = config.voiceGuide !== false;
          document.getElementById('beatSound').checked = config.beatSound !== false;
        } catch (e) {}
      }

      // 페이지 로드/새로고침 시 항상 빈칸 5개로 초기화
      const defaultTime = parseInt(document.getElementById('workTime').value) || 30;
      exercises = Array.from({ length: 5 }, () => ({ name: '', time: defaultTime }));
      document.getElementById('exercises').value = 5;
      
      const select = document.getElementById('routineSelect');
      if (select) select.value = '';
      
      renderExerciseInputs();
    }

    function saveSettings() {
      saveExerciseValues();
      const config = {
        workTime: parseInt(document.getElementById('workTime').value),
        restTime: parseInt(document.getElementById('restTime').value),
        sets: parseInt(document.getElementById('sets').value),
        setRestTime: parseInt(document.getElementById('setRestTime').value),
        voiceGuide: document.getElementById('voiceGuide').checked,
        beatSound: document.getElementById('beatSound').checked
      };
      localStorage.setItem('custom_timer_config', JSON.stringify(config));
      updateDurationSummaries();
    }

    function saveExerciseValues() {
      const container = document.getElementById('exerciseListContainer');
      const rows = container.querySelectorAll('.exercise-row');
      const updated = [];
      rows.forEach((row, idx) => {
        const nameInput = row.querySelector('.ex-name-input');
        const timeInput = row.querySelector('.ex-time-input');
        updated.push({
          name: nameInput.value.trim(),
          time: parseInt(timeInput.value) || parseInt(document.getElementById('workTime').value) || 30
        });
      });
      exercises = updated;
      document.getElementById('exercises').value = exercises.length;
    }

    function renderExerciseInputs() {
      const container = document.getElementById('exerciseListContainer');
      container.innerHTML = '';

      exercises.forEach((item, i) => {
        const itemWrapper = document.createElement('div');
        itemWrapper.className = 'exercise-row flex items-center gap-1.5 w-full';

        const indexBadge = document.createElement('span');
        indexBadge.className = 'text-xs font-bold text-slate-400 w-5 shrink-0 text-center';
        indexBadge.textContent = `${i + 1}`;

        const nameInput = document.createElement('input');
        nameInput.type = 'text';
        nameInput.value = item.name || '';
        nameInput.placeholder = `동작 ${i + 1} 이름 입력...`;
        nameInput.className = 'ex-name-input flex-1 min-w-0 bg-slate-50 hover:bg-white focus:bg-white border border-slate-200 text-slate-700 text-xs font-semibold rounded-xl px-2.5 py-1.5 focus:outline-none focus:ring-2 focus:ring-emerald-400 transition';

        nameInput.addEventListener('focus', () => { lastFocusedIndex = i; });
        nameInput.addEventListener('input', (e) => {
          exercises[i].name = e.target.value;
          saveSettings();
        });

        const timeWrapper = document.createElement('div');
        timeWrapper.className = 'flex items-center shrink-0 bg-slate-50 border border-slate-200 rounded-xl px-2 py-1 gap-1';

        const timeInput = document.createElement('input');
        timeInput.type = 'number';
        timeInput.value = item.time || 30;
        timeInput.min = 5;
        timeInput.max = 600;
        timeInput.className = 'ex-time-input w-9 bg-transparent text-center font-bold text-xs text-rose-600 focus:outline-none';
        timeInput.addEventListener('focus', () => { lastFocusedIndex = i; });
        timeInput.addEventListener('input', (e) => {
          exercises[i].time = parseInt(e.target.value) || 30;
          saveSettings();
        });

        const secLabel = document.createElement('span');
        secLabel.className = 'text-[10px] font-bold text-slate-400';
        secLabel.textContent = '초';

        timeWrapper.appendChild(timeInput);
        timeWrapper.appendChild(secLabel);

        const deleteBtn = document.createElement('button');
        deleteBtn.type = 'button';
        deleteBtn.title = '이 동작 삭제';
        deleteBtn.className = 'shrink-0 p-1.5 text-slate-400 hover:text-rose-500 hover:bg-rose-50 rounded-lg transition flex items-center justify-center';
        deleteBtn.innerHTML = '<i data-lucide="trash" class="w-3.5 h-3.5"></i>';
        deleteBtn.onclick = () => removeExerciseField(i);

        itemWrapper.appendChild(indexBadge);
        itemWrapper.appendChild(nameInput);
        itemWrapper.appendChild(timeWrapper);
        itemWrapper.appendChild(deleteBtn);
        container.appendChild(itemWrapper);
      });

      updateDurationSummaries();
      lucide.createIcons();
    }

    function addExerciseFieldAtCursor() {
      saveExerciseValues();
      const currentCount = exercises.length;
      if (currentCount >= 30) {
        showToast('동작은 최대 30개까지 추가할 수 있습니다.');
        return;
      }

      const defaultTime = parseInt(document.getElementById('workTime').value) || 30;
      const newEx = { name: '', time: defaultTime };

      let insertPos = exercises.length;
      if (lastFocusedIndex >= 0 && lastFocusedIndex < exercises.length) {
        insertPos = lastFocusedIndex + 1;
      }

      exercises.splice(insertPos, 0, newEx);
      document.getElementById('exercises').value = exercises.length;
      renderExerciseInputs();
      saveSettings();

      setTimeout(() => {
        const rows = document.querySelectorAll('.exercise-row');
        if (rows[insertPos]) {
          const input = rows[insertPos].querySelector('.ex-name-input');
          if (input) {
            input.focus();
            rows[insertPos].scrollIntoView({ behavior: 'smooth', block: 'nearest' });
          }
        }
      }, 50);
    }

    function removeExerciseField(index) {
      if (exercises.length <= 1) {
        showToast('최소 1개 이상의 동작이 필요합니다.');
        return;
      }
      saveExerciseValues();
      exercises.splice(index, 1);
      document.getElementById('exercises').value = exercises.length;
      if (lastFocusedIndex >= exercises.length) lastFocusedIndex = exercises.length - 1;
      renderExerciseInputs();
      saveSettings();
    }

    function applyWorkTimeToAll() {
      const val = parseInt(document.getElementById('workTime').value) || 30;
      exercises.forEach(ex => { ex.time = val; });
      renderExerciseInputs();
      saveSettings();
    }

    function adjustVal(id, delta, limit) {
      const el = document.getElementById(id);
      let val = parseInt(el.value) + delta;
      if (delta < 0 && val < limit) val = limit;
      if (delta > 0 && val > limit) val = limit;
      el.value = val;
      saveSettings();
    }

    function applyWorkoutPreset(presetKey, showToastMsg = true) {
      const preset = WORKOUT_PRESETS[presetKey];
      if (!preset) return;

      document.getElementById('workTime').value = preset.workTime;
      document.getElementById('restTime').value = preset.restTime;
      document.getElementById('sets').value = preset.sets;
      document.getElementById('setRestTime').value = preset.setRestTime;

      exercises = JSON.parse(JSON.stringify(preset.exercises));
      document.getElementById('exercises').value = exercises.length;

      const select = document.getElementById('routineSelect');
      if (select) select.value = preset.name;
      activeRoutineTitle = preset.name;

      renderExerciseInputs();
      saveSettings();

      if (showToastMsg) {
        showToast(`'${preset.name}' 루틴이 적용되었습니다.`);
      }
    }

    function handleRoutineNameInput() {
      const nameInput = document.getElementById('routineName');
      const val = nameInput.value;
      if (val.trim().length > 0 && !hasResetOnRoutineInput) {
        document.getElementById('routineSelect').value = '';
        const defaultTime = parseInt(document.getElementById('workTime').value) || 30;
        exercises = Array.from({ length: 5 }, () => ({ name: '', time: defaultTime }));
        document.getElementById('exercises').value = 5;
        renderExerciseInputs();
        saveSettings();
        hasResetOnRoutineInput = true;
      } else if (val.trim().length === 0) {
        hasResetOnRoutineInput = false;
      }
    }

    function saveRoutine() {
      const nameInput = document.getElementById('routineName');
      let name = nameInput.value.trim();
      const select = document.getElementById('routineSelect');

      if (!name && select.value) {
        name = select.value;
      }

      if (!name) {
        showToast('저장할 루틴 이름을 입력하거나 목록에서 선택해주세요.');
        nameInput.focus();
        return;
      }

      saveExerciseValues();
      const routines = getSavedRoutines();
      routines[name] = {
        workTime: parseInt(document.getElementById('workTime').value),
        restTime: parseInt(document.getElementById('restTime').value),
        sets: parseInt(document.getElementById('sets').value),
        setRestTime: parseInt(document.getElementById('setRestTime').value),
        exercises: JSON.parse(JSON.stringify(exercises)),
        isDefault: DEFAULT_PRESET_NAMES.includes(name)
      };

      localStorage.setItem('custom_workout_routines', JSON.stringify(routines));
      updateRoutineSelect();
      select.value = name;
      activeRoutineTitle = name;
      nameInput.value = '';
      hasResetOnRoutineInput = false;
      showToast(`'${name}' 루틴이 저장/수정되었습니다.`);
      updateDurationSummaries();
    }

    function loadSelectedRoutine() {
      const select = document.getElementById('routineSelect');
      const name = select.value;
      if (!name) return;

      const routines = getSavedRoutines();
      const routine = routines[name];
      if (routine) {
        document.getElementById('workTime').value = routine.workTime || 30;
        document.getElementById('restTime').value = routine.restTime !== undefined ? routine.restTime : 0;
        document.getElementById('sets').value = routine.sets || 1;
        document.getElementById('setRestTime').value = routine.setRestTime !== undefined ? routine.setRestTime : 30;
        
        exercises = routine.exercises.map((ex, i) => {
          if (typeof ex === 'string') return { name: ex, time: routine.workTime || 30 };
          return { name: ex.name || '', time: ex.time || 30 };
        });

        document.getElementById('exercises').value = exercises.length;
        activeRoutineTitle = name;
        renderExerciseInputs();
        saveSettings();
        showToast(`'${name}' 루틴을 불러왔습니다.`);
      }
    }

    function deleteSelectedRoutine() {
      const select = document.getElementById('routineSelect');
      const name = select.value;
      if (!name) {
        showToast('삭제할 루틴을 먼저 선택해주세요.');
        return;
      }

      if (DEFAULT_PRESET_NAMES.includes(name)) {
        showToast('기본 추천 루틴은 삭제할 수 없습니다.');
        return;
      }

      const routines = getSavedRoutines();
      delete routines[name];
      localStorage.setItem('custom_workout_routines', JSON.stringify(routines));
      updateRoutineSelect();
      showToast(`'${name}' 루틴이 삭제되었습니다.`);
    }

    function getAudioContext() {
      if (!audioCtx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) {
          audioCtx = new AudioCtx();
          initNoiseBuffer(audioCtx);
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function initNoiseBuffer(ctx) {
      const bufferSize = ctx.sampleRate * 1;
      noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const output = noiseBuffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        output[i] = Math.random() * 2 - 1;
      }
    }

    function speak(text) {
      if (!document.getElementById('voiceGuide').checked) return;
      if (!('speechSynthesis' in window)) return;
      
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'ko-KR';
      utterance.rate = 1.05;
      utterance.pitch = 1.0;
      utterance.volume = 1.0;
      window.speechSynthesis.speak(utterance);
    }

    function playBeep(freq = 600, duration = 0.15) {
      if (!document.getElementById('voiceGuide').checked) return;
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(0.85, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch (e) {}
    }

    // ================== 경쾌한 전진/행진곡 사운드 신시사이저 ==================
    function playMarchKick(time = 0) {
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        const t = time || ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(150, t);
        osc.frequency.exponentialRampToValueAtTime(38, t + 0.12);
        gain.gain.setValueAtTime(0.7, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(t);
        osc.stop(t + 0.12);
      } catch (e) {}
    }

    function playMarchSnare(time = 0, isAccent = true) {
      try {
        const ctx = getAudioContext();
        if (!ctx || !noiseBuffer) return;
        const t = time || ctx.currentTime;
        
        // 노이즈 스네어 성분
        const noise = ctx.createBufferSource();
        noise.buffer = noiseBuffer;
        const filter = ctx.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.setValueAtTime(1200, t);
        
        const noiseGain = ctx.createGain();
        const vol = isAccent ? 0.45 : 0.22;
        noiseGain.gain.setValueAtTime(vol, t);
        noiseGain.gain.exponentialRampToValueAtTime(0.001, t + (isAccent ? 0.14 : 0.07));
        
        noise.connect(filter);
        filter.connect(noiseGain);
        noiseGain.connect(ctx.destination);
        noise.start(t);
        noise.stop(t + (isAccent ? 0.14 : 0.07));

        // 스네어 바디 톤 성분
        const osc = ctx.createOscillator();
        const oscGain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(isAccent ? 240 : 200, t);
        osc.frequency.exponentialRampToValueAtTime(100, t + 0.08);
        oscGain.gain.setValueAtTime(isAccent ? 0.35 : 0.15, t);
        oscGain.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
        osc.connect(oscGain);
        oscGain.connect(ctx.destination);
        osc.start(t);
        osc.stop(t + 0.08);
      } catch (e) {}
    }

    function playMarchBrassNote(freq, time = 0, duration = 0.12) {
      try {
        const ctx = getAudioContext();
        if (!ctx || !freq) return;
        const t = time || ctx.currentTime;
        const osc1 = ctx.createOscillator();
        const osc2 = ctx.createOscillator();
        const gain = ctx.createGain();

        osc1.type = 'sawtooth';
        osc2.type = 'triangle';
        osc1.frequency.setValueAtTime(freq, t);
        osc2.frequency.setValueAtTime(freq * 1.003, t);

        const filter = ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(1800, t);
        filter.frequency.exponentialRampToValueAtTime(600, t + duration);

        gain.gain.setValueAtTime(0.28, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + duration);

        osc1.connect(filter);
        osc2.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);

        osc1.start(t);
        osc2.start(t);
        osc1.stop(t + duration);
        osc2.stop(t + duration);
      } catch (e) {}
    }

    // 경쾌한 행진곡 멜로디 시퀀스 (C Major 행진 팡파르)
    const MARCH_MELODY = [
      261.63, 0, 329.63, 0, 392.00, 392.00, 523.25, 0,
      392.00, 0, 329.63, 0, 261.63, 329.63, 392.00, 0,
      349.23, 0, 440.00, 0, 523.25, 523.25, 587.33, 0,
      523.25, 0, 392.00, 0, 329.63, 293.66, 261.63, 0
    ];

    function stepMarchingCadence() {
      if (!document.getElementById('beatSound').checked) return;
      if (currentPhase !== 'WORK' || isPaused) return;

      const step16 = musicStep % 16;
      const step32 = musicStep % 32;

      // 1. 킥 드럼 (정박 1, 3拍 쿵!)
      if (step16 === 0 || step16 === 8) {
        playMarchKick();
      }

      // 2. 마칭 스네어 (2, 4拍 딱! & 중간 마칭 롤)
      if (step16 === 4 || step16 === 12) {
        playMarchSnare(0, true);
      } else if (step16 === 2 || step16 === 6 || step16 === 10 || step16 === 14) {
        // 행진 스네어 잔음 롤
        playMarchSnare(0, false);
      }

      // 스퍼트 구간(5초 이하)에는 스네어 연타 가속
      if (timeLeft <= 5 && (step16 % 2 === 1)) {
        playMarchSnare(0, false);
      }

      // 3. 경쾌한 브라스 멜로디
      const noteFreq = MARCH_MELODY[step32];
      if (noteFreq) {
        const pitchMultiplier = timeLeft <= 5 ? 1.25 : (timeLeft <= 10 ? 1.12 : 1.0);
        playMarchBrassNote(noteFreq * pitchMultiplier, 0, 0.11);
      }

      musicStep++;
    }

    function startMarchingCadence() {
      stopMarchingCadence();
      if (!document.getElementById('beatSound').checked) return;
      if (currentPhase !== 'WORK' || isPaused) return;

      // 평소: 125ms (~120BPM), 10초 이하: 105ms (~142BPM), 5초 이하: 85ms (~176BPM 행진 스퍼트)
      let intervalMs = 125;
      if (timeLeft <= 5) {
        intervalMs = 85;
      } else if (timeLeft <= 10) {
        intervalMs = 105;
      }

      musicInterval = setInterval(() => {
        stepMarchingCadence();
      }, intervalMs);
    }

    function stopMarchingCadence() {
      if (musicInterval) {
        clearInterval(musicInterval);
        musicInterval = null;
      }
    }

    function startHeartbeatSchedulerForCurrentSecond(secLeft) {
      stopHeartbeatScheduler();
      if (currentPhase !== 'WORK' || isPaused) return;

      if (secLeft > 10) {
        playHeartbeatBeat(false);
      } else if (secLeft <= 10 && secLeft > 5) {
        playHeartbeatBeat(false);
        heartbeatInterval = setInterval(() => {
          if (!isPaused && currentPhase === 'WORK') playHeartbeatBeat(false);
        }, 500);
      } else if (secLeft <= 5 && secLeft > 0) {
        playHeartbeatBeat(true);
        heartbeatInterval = setInterval(() => {
          if (!isPaused && currentPhase === 'WORK') playHeartbeatBeat(true);
        }, 250);
      }
    }

    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) {}
    }

    function releaseWakeLock() {
      if (wakeLock) {
        wakeLock.release().then(() => { wakeLock = null; });
      }
    }

    function getExName(index) {
      const raw = exercises[index]?.name?.trim();
      return raw ? raw : `동작 ${index + 1}`;
    }

    function startWorkout() {
      getAudioContext();
      saveExerciseValues();
      saveSettings();

      totalExercises = exercises.length;
      totalSets = parseInt(document.getElementById('sets').value);
      restTime = parseInt(document.getElementById('restTime').value);
      setRestTime = parseInt(document.getElementById('setRestTime').value);

      // 루틴 이름 결정
      const select = document.getElementById('routineSelect');
      const inputName = document.getElementById('routineName').value.trim();
      activeRoutineTitle = inputName || select.value || '맞춤 루틴';
      
      const routineNameText = document.getElementById('displayRoutineNameText');
      if (routineNameText) routineNameText.textContent = activeRoutineTitle;

      // 예상 소요시간 계산
      const durations = calculateRoutineDurations();
      plannedTotalSeconds = durations.totalDuration;
      plannedWorkSeconds = durations.totalWorkTime;
      totalElapsedSeconds = 0;
      totalWorkoutSeconds = 0;

      document.getElementById('setupView').classList.add('hidden');
      document.getElementById('timerView').classList.remove('hidden');

      requestWakeLock();
      isPaused = false;
      updatePauseUI();

      currentSet = 1;
      currentEx = 0;
      currentPhase = 'READY';
      timeLeft = 10;
      phaseTotalTime = 10;
      musicStep = 0;

      updateTimerDisplay();

      // '운동준비' 멘트 전에 다음 운동 미리 알려주기
      const firstExerciseName = getExName(0);
      speak(`첫 번째 운동은 ${firstExerciseName}입니다. 운동을 준비하세요. 10초 전`);

      clearInterval(timerInterval);
      stopMarchingCadence();
      timerInterval = setInterval(timerTick, 1000);
    }

    function timerTick() {
      if (isPaused) return;

      // 누적 시간 카운팅
      totalElapsedSeconds++;
      if (currentPhase === 'WORK') {
        totalWorkoutSeconds++;
      }

      timeLeft--;

      // 10초 및 5초 시점에 행진곡 템포 가속 재설정
      if (currentPhase === 'WORK' && (timeLeft === 10 || timeLeft === 5)) {
        startMarchingCadence();
      }

      if (timeLeft <= 3 && timeLeft > 0) {
        playBeep(440 + (4 - timeLeft) * 80, 0.12);
      }

      if (timeLeft < 0) {
        stopMarchingCadence();
        handlePhaseTransition();
      } else {
        updateTimerDisplay();
      }
    }

    function handlePhaseTransition() {
      if (currentPhase === 'READY') {
        currentPhase = 'WORK';
        currentEx = 1;
        const targetTime = exercises[0]?.time || defaultWorkTime;
        timeLeft = targetTime;
        phaseTotalTime = targetTime;
        musicStep = 0;
        playBeep(880, 0.3);
        speak(`${getExName(0)}, 시작!`);
        startMarchingCadence();
      } 
      else if (currentPhase === 'WORK') {
        stopMarchingCadence();
        if (currentEx === totalExercises) {
          if (currentSet === totalSets) {
            finishWorkout();
            return;
          } else {
            currentSet++;
            currentEx = 1;
            const nextFirstEx = getExName(0);
            if (setRestTime > 0) {
              currentPhase = 'SET_REST';
              timeLeft = setRestTime;
              phaseTotalTime = setRestTime;
              playBeep(550, 0.3);
              speak(`세트 완료. ${setRestTime}초간 휴식입니다. 다음 세트 첫 동작은 ${nextFirstEx}입니다.`);
            } else {
              currentPhase = 'WORK';
              const targetTime = exercises[0]?.time || defaultWorkTime;
              timeLeft = targetTime;
              phaseTotalTime = targetTime;
              musicStep = 0;
              playBeep(880, 0.3);
              speak(`세트 ${currentSet}, ${nextFirstEx} 시작!`);
              startMarchingCadence();
            }
          }
        } else {
          currentEx++;
          const nextExName = getExName(currentEx - 1);
          if (restTime > 0) {
            currentPhase = 'REST';
            timeLeft = restTime;
            phaseTotalTime = restTime;
            playBeep(520, 0.25);
            speak(`휴식. 다음 운동은 ${nextExName}입니다.`);
          } else {
            currentPhase = 'WORK';
            const targetTime = exercises[currentEx - 1]?.time || defaultWorkTime;
            timeLeft = targetTime;
            phaseTotalTime = targetTime;
            musicStep = 0;
            playBeep(880, 0.3);
            speak(`${nextExName}, 시작!`);
            startMarchingCadence();
          }
        }
      } 
      else if (currentPhase === 'REST' || currentPhase === 'SET_REST') {
        currentPhase = 'WORK';
        const targetTime = exercises[currentEx - 1]?.time || defaultWorkTime;
        timeLeft = targetTime;
        phaseTotalTime = targetTime;
        musicStep = 0;
        playBeep(880, 0.3);
        speak(`${getExName(currentEx - 1)}, 시작!`);
        startMarchingCadence();
      }

      updateTimerDisplay();
    }

    function finishWorkout() {
      clearInterval(timerInterval);
      stopMarchingCadence();
      releaseWakeLock();

      currentPhase = 'FINISHED';
      document.getElementById('stateBadge').textContent = '운동 완료 🎉';
      document.getElementById('stateBadge').className = 'px-3 py-1 rounded-full text-xs font-extrabold tracking-wider uppercase bg-emerald-100 text-emerald-800 mb-1';
      document.getElementById('displayTime').textContent = '완료!';
      document.getElementById('displayExerciseName').textContent = '정말 수고하셨습니다!';
      document.getElementById('nextBox').classList.add('hidden');
      
      const circle = document.getElementById('progressCircle');
      circle.style.strokeDashoffset = 0;
      circle.setAttribute('stroke', '#10b981');
      document.getElementById('circleContainer').className = 'relative flex items-center justify-center my-3';

      // 최종 시간 갱신
      document.getElementById('displayTotalElapsed').textContent = `${formatTimeSec(totalElapsedSeconds)} / ${formatTimeSec(plannedTotalSeconds)}`;
      document.getElementById('displayWorkElapsed').textContent = `${formatTimeSec(totalWorkoutSeconds)} / ${formatTimeSec(plannedWorkSeconds)}`;

      playBeep(880, 0.5);
      speak("모든 운동을 완료했습니다. 정말 수고하셨습니다!");
    }

    function updateTimerDisplay() {
      const badge = document.getElementById('stateBadge');
      const timeText = document.getElementById('displayTime');
      const exName = document.getElementById('displayExerciseName');
      const nextName = document.getElementById('displayNextName');
      const setInfo = document.getElementById('displaySetInfo');
      const exInfo = document.getElementById('displayExInfo');
      const circle = document.getElementById('progressCircle');
      const nextBox = document.getElementById('nextBox');
      const circleContainer = document.getElementById('circleContainer');

      // 누적 진행 시간 / 총 계획 시간 표시
      const totalElapsedEl = document.getElementById('displayTotalElapsed');
      const workElapsedEl = document.getElementById('displayWorkElapsed');
      if (totalElapsedEl) {
        totalElapsedEl.textContent = `${formatTimeSec(totalElapsedSeconds)} / ${formatTimeSec(plannedTotalSeconds)}`;
      }
      if (workElapsedEl) {
        workElapsedEl.textContent = `${formatTimeSec(totalWorkoutSeconds)} / ${formatTimeSec(plannedWorkSeconds)}`;
      }

      nextBox.classList.remove('hidden');
      timeText.textContent = timeLeft;
      setInfo.textContent = `세트 ${currentSet} / ${totalSets}`;

      circleContainer.classList.remove('pulse-rhythm', 'pulse-urgent');

      if (currentPhase === 'READY') {
        badge.textContent = '준비';
        badge.className = 'px-3 py-1 rounded-full text-xs font-extrabold tracking-wider uppercase bg-amber-100 text-amber-800 mb-1';
        exName.textContent = '운동 준비';
        exInfo.textContent = '시작 전 10초';
        nextName.textContent = getExName(0);
        circle.setAttribute('stroke', '#f59e0b');
      } else if (currentPhase === 'WORK') {
        exName.textContent = getExName(currentEx - 1);
        exInfo.textContent = `동작 ${currentEx} / ${totalExercises}`;

        if (timeLeft <= 5) {
          badge.textContent = '스퍼트! 🔥';
          badge.className = 'px-3 py-1 rounded-full text-xs font-extrabold tracking-wider uppercase bg-rose-500 text-white mb-1 shadow-md';
          circleContainer.classList.add('pulse-urgent');
        } else {
          badge.textContent = '운동 중 🔥';
          badge.className = 'px-3 py-1 rounded-full text-xs font-extrabold tracking-wider uppercase bg-rose-100 text-rose-700 mb-1';
          circleContainer.classList.add('pulse-rhythm');
        }
        
        if (currentEx < totalExercises) {
          nextName.textContent = getExName(currentEx);
        } else if (currentSet < totalSets) {
          nextName.textContent = `[다음 세트] ${getExName(0)}`;
        } else {
          nextName.textContent = '마지막 동작입니다!';
        }
        circle.setAttribute('stroke', '#ef4444');
      } else if (currentPhase === 'REST') {
        badge.textContent = '휴식 ☕';
        badge.className = 'px-3 py-1 rounded-full text-xs font-extrabold tracking-wider uppercase bg-blue-100 text-blue-700 mb-1';
        exName.textContent = '숨 고르기';
        exInfo.textContent = `동작 ${currentEx} / ${totalExercises}`;
        nextName.textContent = getExName(currentEx) || getExName(0);
        circle.setAttribute('stroke', '#3b82f6');
      } else if (currentPhase === 'SET_REST') {
        badge.textContent = '세트 휴식 ⏳';
        badge.className = 'px-3 py-1 rounded-full text-xs font-extrabold tracking-wider uppercase bg-purple-100 text-purple-700 mb-1';
        exName.textContent = `세트 ${currentSet - 1} 완료!`;
        exInfo.textContent = `다음: 세트 ${currentSet}`;
        nextName.textContent = `[새 세트] ${getExName(0)}`;
        circle.setAttribute('stroke', '#8b5cf6');
      }

      const fraction = phaseTotalTime > 0 ? (timeLeft / phaseTotalTime) : 0;
      const offset = CIRCLE_CIRCUMFERENCE * (1 - fraction);
      circle.style.strokeDashoffset = offset;
    }

    function togglePause() {
      isPaused = !isPaused;
      if (isPaused) {
        stopMarchingCadence();
      } else if (currentPhase === 'WORK') {
        startMarchingCadence();
      }
      updatePauseUI();
    }

    function skipExercise() {
      if (currentPhase === 'FINISHED') return;
      
      // 진행 중인 행진곡 및 음성 즉시 중단
      stopMarchingCadence();
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      
      // 일시정지 상태였다면 해제
      if (isPaused) {
        isPaused = false;
        updatePauseUI();
      }
      
      // 다음 단계로 강제 전환
      handlePhaseTransition();
    }

    function updatePauseUI() {
      const pauseText = document.getElementById('pauseText');
      const pauseIcon = document.getElementById('pauseIcon');
      if (isPaused) {
        pauseText.textContent = '계속 진행';
        pauseIcon.setAttribute('data-lucide', 'play');
      } else {
        pauseText.textContent = '일시정지';
        pauseIcon.setAttribute('data-lucide', 'pause');
      }
      lucide.createIcons();
    }

    function stopWorkout() {
      clearInterval(timerInterval);
      stopMarchingCadence();
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      releaseWakeLock();

      document.getElementById('timerView').classList.add('hidden');
      document.getElementById('setupView').classList.remove('hidden');
    }
  </script>
